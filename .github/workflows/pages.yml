name: MyMG Pages (on demand via dev changes)

on:
  push:
    branches: [dev]
    paths:
      - 'apps/portal/**'
      - 'animations/*/web/**'
      - 'packages/mg/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mymg-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Pages must be initialized once by a repository administrator.
      # Do not try enablement:true with the restricted workflow token.
      - name: Configure existing Pages site
        uses: actions/configure-pages@v5
      - name: Checkout dev
        uses: actions/checkout@v4
      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - name: Set up Node with cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests and workspace validation
        run: pnpm check
      - name: Build Pages portal
        run: pnpm --filter @mymg/portal build
        env:
          MYMG_BASE_PATH: /MyMG/
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/portal/dist
      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify published HTML and assets
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          for attempt in $(seq 1 12); do
            if curl --location --fail --silent --show-error "$PAGE_URL" -o /tmp/mymg-deployed.html; then break; fi
            sleep 5
          done
          grep -q 'id="root"' /tmp/mymg-deployed.html
          grep -q '/MyMG/assets/' /tmp/mymg-deployed.html
          echo "Published HTML verified at $PAGE_URL"
          # HBM uses a hash route so the same static document is served.
          curl --location --fail --silent --show-error "${PAGE_URL%/}/#/hbm" -o /tmp/mymg-hbm-deployed.html
          cmp /tmp/mymg-deployed.html /tmp/mymg-hbm-deployed.html
