name: MyMG Pages (on demand via dev changes)

on:
  push:
    branches: [dev]
    paths:
      - 'apps/portal/**'
      - '!apps/portal/README.md'
      - '!apps/portal/**/*.md'
      - 'animations/*/web/**'
      - 'animations/hbm/src/**'
      - 'animations/hbm/requirements.txt'
      - 'tooling/render-hbm-master.sh'
      - 'tooling/verify-hbm-master.py'
      - 'packages/mg/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mymg-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Pages must be initialized once by a repository administrator.
      # Do not try enablement:true with the restricted workflow token.
      - name: Configure existing Pages site
        uses: actions/configure-pages@v5
      - name: Checkout dev
        uses: actions/checkout@v4
      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - name: Set up Node with cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests and workspace validation
        run: pnpm check
      - name: Build Pages portal
        run: pnpm --filter @mymg/portal build
        env:
          MYMG_BASE_PATH: /MyMG/
      - name: Restore cached canonical HBM film
        id: hbm-cache
        uses: actions/cache@v4
        with:
          path: apps/portal/dist/media
          key: hbm-mustard03-v1-${{ hashFiles('animations/hbm/src/**/*.py', 'animations/hbm/requirements.txt', 'tooling/render-hbm-master.sh', 'tooling/verify-hbm-master.py') }}
      - name: Python for canonical HBM render
        if: steps.hbm-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: animations/hbm/requirements.txt
      - name: Install canonical film fonts and Python dependencies
        if: steps.hbm-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk fonts-inter ffmpeg
          python -m pip install -r animations/hbm/requirements.txt
          test -f /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
          test -f /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc
      - name: Render and verify HBM Mustard-03
        if: steps.hbm-cache.outputs.cache-hit != 'true'
        run: bash tooling/render-hbm-master.sh apps/portal/dist/media
      - name: Require original, playable derivative and cover
        run: |
          test -s apps/portal/dist/media/hbm-python-original.mp4
          test -s apps/portal/dist/media/hbm-mustard03.mp4
          test -s apps/portal/dist/media/hbm-poster.jpg
          test -s apps/portal/dist/media/hbm-master-sha256.txt
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/portal/dist
      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify published HTML and assets
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          for attempt in $(seq 1 12); do
            if curl --location --fail --silent --show-error "$PAGE_URL" -o /tmp/mymg-deployed.html; then break; fi
            sleep 5
          done
          grep -q 'id="root"' /tmp/mymg-deployed.html
          grep -q '/MyMG/assets/' /tmp/mymg-deployed.html
          for media in hbm-mustard03.mp4 hbm-python-original.mp4 hbm-poster.jpg hbm-master-sha256.txt; do
            curl --location --fail --silent --show-error "${PAGE_URL%/}/media/$media" -o "/tmp/$media"
            test -s "/tmp/$media"
          done
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -of json /tmp/hbm-mustard03.mp4 | grep -q '"codec_name": "h264"'
          echo "Published HBM full film and source verified at $PAGE_URL"
          # HBM uses a hash route so the same static document is served.
          curl --location --fail --silent --show-error "${PAGE_URL%/}/#/hbm" -o /tmp/mymg-hbm-deployed.html
          cmp /tmp/mymg-deployed.html /tmp/mymg-hbm-deployed.html
