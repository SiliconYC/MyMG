name: MyMG Portal QA (PR only)

on:
  pull_request:
    branches: [dev]
    paths:
      - 'apps/portal/**'
      - 'animations/*/web/**'
      - 'packages/mg/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'tooling/qa-portal.mjs'
      - '.github/workflows/portal-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Test structure, types and timing
        run: pnpm check
      - name: Build portal
        run: pnpm --filter @mymg/portal build
        env:
          MYMG_BASE_PATH: /MyMG/
      - name: Install browser
        run: pnpm --filter @mymg/portal exec playwright install --with-deps chromium
      - name: Start local preview
        run: |
          nohup pnpm --filter @mymg/portal exec vite preview --host 127.0.0.1 --port 4173 > /tmp/mymg-vite-preview.log 2>&1 &
          for n in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/MyMG/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mymg-vite-preview.log
          exit 1
      - name: Check portal routes and screenshot 3D sample
        run: pnpm --filter @mymg/portal qa
        env:
          MYMG_QA_URL: http://127.0.0.1:4173/MyMG/
          MYMG_QA_OUTPUT: ${{ github.workspace }}/output/qa-portal
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mymg-portal-qa
          path: output/qa-portal/
          if-no-files-found: warn
