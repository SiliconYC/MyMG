name: MyMG Portal QA (PR only)

on:
  pull_request:
    branches: [dev]
    paths:
      - 'apps/portal/**'
      - '!apps/portal/README.md'
      - '!apps/portal/**/*.md'
      - 'animations/*/web/**'
      - 'animations/hbm/src/**'
      - 'animations/hbm/requirements.txt'
      - 'tooling/render-hbm-master.sh'
      - 'tooling/verify-hbm-master.py'
      - 'packages/mg/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'apps/portal/qa-portal.mjs'
      - '.github/workflows/portal-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test structure, types and timing
        run: pnpm check
      - name: Build portal
        run: pnpm --filter @mymg/portal build
        env:
          MYMG_BASE_PATH: /MyMG/
      - name: Restore cached canonical HBM media
        id: hbm-cache
        uses: actions/cache@v4
        with:
          path: apps/portal/dist/media
          key: hbm-mustard03-v1-${{ hashFiles('animations/hbm/src/**/*.py', 'animations/hbm/requirements.txt', 'tooling/render-hbm-master.sh', 'tooling/verify-hbm-master.py') }}
      - name: Python for canonical HBM render
        if: steps.hbm-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: animations/hbm/requirements.txt
      - name: Install canonical film fonts and Python dependencies
        if: steps.hbm-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk fonts-inter
          python -m pip install -r animations/hbm/requirements.txt
      - name: Render and verify HBM Mustard-03
        if: steps.hbm-cache.outputs.cache-hit != 'true'
        run: bash tooling/render-hbm-master.sh apps/portal/dist/media
      - name: Install browser
        run: pnpm --filter @mymg/portal exec playwright install --with-deps chromium
      - name: Start local preview
        run: |
          nohup pnpm --filter @mymg/portal exec vite preview --host 127.0.0.1 --port 4173 > /tmp/mymg-vite-preview.log 2>&1 &
          for n in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/MyMG/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mymg-vite-preview.log
          exit 1
      - name: Check full HBM master MP4, transport and nine screenshots
        run: pnpm --filter @mymg/portal qa
        env:
          MYMG_QA_URL: http://127.0.0.1:4173/MyMG/
          MYMG_QA_OUTPUT: ${{ github.workspace }}/output/qa-portal
      - name: Verify GPU-independent demo in Chromium
        run: pnpm --filter @mymg/portal qa:react
        env:
          MYMG_QA_URL: http://127.0.0.1:4173/MyMG/
          MYMG_QA_OUTPUT: ${{ github.workspace }}/output/qa-portal
      - name: Preserve preview startup log
        if: always()
        run: |
          mkdir -p output/qa-portal
          if test -f /tmp/mymg-vite-preview.log; then cp /tmp/mymg-vite-preview.log output/qa-portal/vite-preview.log; fi
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mymg-portal-qa
          path: |
            output/qa-portal/
            pnpm-lock.yaml
          if-no-files-found: warn
